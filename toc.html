<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />

    <title>K5Tech TOC Attendance</title>

    <link rel="manifest" href="manifest-toc.json" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      /* * {
        box-sizing: border-box;
      } */

      /* =====================================================
   GLOBAL DARK GLASS THEME
===================================================== */

      :root {
        --theme-bg-dark: #0a0c12;
        --theme-bg-deep: #121621;

        --theme-glass: rgba(255, 255, 255, 0.06);
        --theme-glass-light: rgba(255, 255, 255, 0.08);
        --theme-glass-dark: rgba(0, 0, 0, 0.3);

        --theme-border: rgba(255, 255, 255, 0.1);
        --theme-border-light: rgba(255, 255, 255, 0.15);

        --theme-text: #ffffff;
        --theme-text-soft: #e2e8f0;
        --theme-muted: #a0aec0;

        --theme-red: #d6001c;
        --theme-red-dark: #b50017;

        --theme-blue: #0056ff;
        --theme-green: #2ecc71;

        --theme-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      /* =====================================================
   GLOBAL BODY
===================================================== */

      body {
        font-family: Arial, sans-serif;

        margin: 0;

        color: var(--theme-text);

        background:
          radial-gradient(
            circle,
            rgba(18, 22, 33, 0.85) 30%,
            rgba(10, 12, 18, 0.98) 100%
          ),
          url("K5Tech_Icon_512.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        min-height: 100vh;
      }

      /* =====================================================
   GLOBAL VIEW CONTAINERS
===================================================== */

      #attendanceView,
      #pinOverlay {
        min-height: 100vh;

        background: radial-gradient(
          circle,
          rgba(18, 22, 33, 0.8) 30%,
          rgba(10, 12, 18, 0.96) 100%
        );
      }

      /* =====================================================
   SHARED CONTAINER
===================================================== */

      .container {
        max-width: 560px;
        margin: auto;
        padding: 20px;
      }

      /* =====================================================
   GLASS CARD
===================================================== */

      .card {
        background: rgba(255, 255, 255, 0.06);

        backdrop-filter: blur(16px);

        -webkit-backdrop-filter: blur(16px);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 16px;

        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        padding: 20px 16px 30px;
      }

      button,
      input,
      textarea {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .hidden {
        display: none !important;
      }

      .app-header {
        text-align: center;
        margin-bottom: 22px;
      }

      .app-header h1 {
        margin: 0;
        font-size: 24px;
      }

      .app-header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      /* =====================================================
   LOGIN
===================================================== */

      /* 1. Global View Wrapper & Background */
      #selectUserView {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;

        /* Blends a dark vignette gradient over the logo so text stays readable */
        background:
          radial-gradient(
            circle,
            rgba(18, 22, 33, 0.85) 30%,
            rgba(10, 12, 18, 0.98) 100%
          ),
          url("K5Tech_Icon_512.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      #selectUserView input,
      #selectUserView textarea {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        outline: none;
        background: rgba(0, 0, 0, 0.3);
        color: #ffffff;
        box-sizing: border-box;
      }

      #selectUserView input:focus,
      #selectUserView textarea:focus {
        border-color: #0056ff;
        box-shadow: 0 0 8px rgba(0, 86, 255, 0.4);
      }

      /* 2. Glassmorphism Login Card Layout */
      .login-card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.06); /* Translucent white surface */
        backdrop-filter: blur(16px); /* Blurs logo graphics behind the card */
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        box-sizing: border-box;
      }

      /* 3. Logo Image Formatting */
      .login-logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.5rem;
        border-radius: 18px;
      }

      .login-logo-img {
        max-width: 120px;
        height: auto;
        display: block;
      }

      /* 4. Typography Theme Alignment */
      .login-title {
        text-align: center;
        margin: 0;
        font-size: 25px;
        color: #ffffff; /* Bright white title text */
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .login-subtitle {
        text-align: center;
        margin: 8px 0 25px;
        font-size: 14px;
        color: #a0aec0; /* Soft muted gray-blue */
      }

      .form-label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: bold;
        color: #e2e8f0; /* Light silver input labels */
      }

      /* 5. Translucent Form Inputs */
      input,
      textarea {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15); /* Translucent light border */
        outline: none;
        background: rgba(0, 0, 0, 0.3); /* Dark contrast field background */
        color: #ffffff; /* White user-input text */
        box-sizing: border-box;
      }

      /* Active field focus matches your theme colors */
      input:focus,
      textarea:focus {
        border-color: #0056ff; /* Vibrant blue logo highlight color */
        box-shadow: 0 0 8px rgba(0, 86, 255, 0.4);
      }

      textarea {
        resize: none;
        height: 70px;
      }

      /* 6. Vivid Red Theme Action Button */
      .primary-btn {
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        border: none;
        border-radius: 9px;
        background: #d6001c; /* Vibrant logo red accent color */
        color: #ffffff;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .primary-btn:hover {
        background: #b50017; /* Darkens smoothly on hover */
      }

      /* =====================================================
   DASHBOARD
===================================================== */

      #dashboardView {
        padding-top: 20px;
      }

      /* =====================================================
   DASHBOARD WELCOME HEADER
===================================================== */

      .dashboard-top {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.03)
        );

        backdrop-filter: blur(16px);

        -webkit-backdrop-filter: blur(16px);

        color: #ffffff;

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 16px;

        padding: 22px;

        margin-bottom: 15px;

        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      }

      .dashboard-top h2 {
        margin: 0;

        font-size: 23px;

        color: #ffffff;

        font-weight: 700;

        letter-spacing: -0.3px;
      }

      .employee-id-display {
        margin-top: 7px;

        font-size: 13px;

        color: #a0aec0;
      }

      /* =====================================================
   CUTOFF DISPLAY
===================================================== */

      .cutoff-card {
        margin-top: 18px;

        padding: 12px 15px;

        border-radius: 10px;

        background: rgba(0, 0, 0, 0.25);

        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .cutoff-label {
        font-size: 11px;

        color: #a0aec0;

        text-transform: uppercase;

        letter-spacing: 0.5px;
      }

      .cutoff-value {
        font-size: 15px;

        font-weight: bold;

        margin-top: 4px;

        color: #ffffff;
      }

      /* =====================================================
   DASHBOARD ACTION BUTTONS
===================================================== */

      .dashboard-actions {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 10px;

        margin-bottom: 15px;
      }

      .action-btn {
        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 9px;

        padding: 13px 10px;

        font-size: 14px;

        font-weight: bold;

        transition: all 0.2s ease;
      }

      /* Record Attendance */

      .record-btn {
        background: #d6001c;

        color: #ffffff;

        box-shadow: 0 5px 15px rgba(214, 0, 28, 0.25);
      }

      .record-btn:hover {
        background: #b50017;

        transform: translateY(-1px);
      }

      /* Refresh */

      .refresh-btn {
        background: rgba(255, 255, 255, 0.06);

        color: #e2e8f0;

        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .refresh-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* TOC kiosk switch link */

      .toc-switch-link {
        display: block;

        text-align: center;

        margin: 4px 0 15px;

        padding: 10px;

        border-radius: 9px;

        background: rgba(255, 255, 255, 0.06);

        border: 1px solid rgba(255, 255, 255, 0.12);

        color: #e2e8f0;

        text-decoration: none;

        font-size: 13px;

        font-weight: bold;

        transition: all 0.2s ease;
      }

      .toc-switch-link:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* =====================================================
   ATTENDANCE TABLE CARD
===================================================== */

      .table-card {
        background: rgba(255, 255, 255, 0.06);

        backdrop-filter: blur(16px);

        -webkit-backdrop-filter: blur(16px);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 14px;

        padding: 10px;

        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);

        overflow: hidden;
      }

      .table-title {
        font-size: 15px;

        font-weight: bold;

        color: #ffffff;

        padding: 7px 6px 11px;
      }

      /* =====================================================
        DARK ATTENDANCE TABLE
      ===================================================== */
      .table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch; /* Smooth scrolling on mobile devices */
        width: 100%;
      }
      .attendance-table {
        width: 100%;
        min-width: 470px;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
        color: #e2e8f0;
      }

      .attendance-table th {
        background: rgba(0, 0, 0, 0.3);

        color: #a0aec0;

        padding: 8px 6px;

        text-align: center;

        font-weight: bold;

        white-space: nowrap;

        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .attendance-table td {
        padding: 7px 5px;

        height: 34px;

        text-align: center;

        white-space: nowrap;

        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .attendance-table th:first-child,
      .attendance-table td:first-child {
        text-align: left;

        padding-left: 8px;
      }

      /* =====================================================
   WEEKEND ROW
===================================================== */

      .attendance-table tbody tr.weekend {
        background: rgba(255, 255, 255, 0.025);
      }

      /* =====================================================
   TODAY
===================================================== */

      .attendance-table tbody tr.today {
        background: rgba(0, 86, 255, 0.12);
      }

      /* =====================================================
   DATE
===================================================== */

      .date-cell {
        font-weight: bold;

        color: #ffffff;
      }

      .date-day {
        color: #a0aec0;

        font-weight: normal;

        margin-left: 3px;
      }

      /* =====================================================
   RECORDED TIME
===================================================== */

      .time-recorded {
        color: #6ee7a0;

        font-weight: bold;
      }

      /* =====================================================
   MISSING TIME
===================================================== */

      .time-missing {
        color: rgba(160, 174, 192, 0.45);
      }

      /* =====================================================
   DASHBOARD STATUS
===================================================== */

      .dashboard-status {
        font-size: 12px;

        color: #a0aec0;

        text-align: center;

        padding: 12px 5px;
      }

      /* =====================================================
   LOGOUT BUTTON
===================================================== */

      .logout-btn {
        width: 100%;

        margin-top: 10px;

        padding: 12px;

        border: 1px solid rgba(214, 0, 28, 0.25);

        border-radius: 8px;

        background: rgba(214, 0, 28, 0.08);

        color: #ff7180;

        font-weight: bold;

        transition: all 0.2s ease;
      }

      .logout-btn:hover {
        background: rgba(214, 0, 28, 0.16);

        color: #ffffff;
      }

      /* =====================================================
   RECORD ATTENDANCE PAGE
===================================================== */

      /* #attendanceView {
        min-height: 100vh;

        padding: 20px 16px 30px;

        box-sizing: border-box;

      }

      #attendanceView .container {
        padding: 0;
      } */
      /* =====================================================
   ATTENDANCE HEADER
===================================================== */

      .attendance-header {
        display: flex;

        align-items: center;

        gap: 10px;

        margin-bottom: 15px;
      }

      .attendance-employee {
        flex: 1;
      }

      .attendance-employee-name {
        font-weight: bold;

        font-size: 16px;

        color: #ffffff;
      }

      .attendance-employee-id {
        font-size: 12px;

        color: #a0aec0;

        margin-top: 2px;
      }

      /* =====================================================
   BACK BUTTON
===================================================== */

      .back-btn {
        width: auto;

        padding: 10px 14px;

        margin: 0;

        border: 1px solid rgba(255, 255, 255, 0.12);

        border-radius: 8px;

        background: rgba(255, 255, 255, 0.06);

        color: #e2e8f0;

        font-weight: bold;

        transition: all 0.2s ease;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* =====================================================
   GPS / SYNC STATUS
===================================================== */

      #gps {
        font-size: 14px;

        margin-bottom: 5px;

        color: #e2e8f0;
      }

      #syncStatus {
        font-size: 13px;

        margin-bottom: 10px;
      }

      .location-note {
        font-size: 12px;

        color: #a0aec0;

        margin-bottom: 15px;
      }

      /* =====================================================
   ATTENDANCE FORM INPUTS
===================================================== */

      #attendanceView input,
      #attendanceView textarea {
        background: rgba(0, 0, 0, 0.3);

        color: #ffffff;

        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      #attendanceView input::placeholder,
      #attendanceView textarea::placeholder {
        color: #718096;
      }

      #attendanceView input:focus,
      #attendanceView textarea:focus {
        border-color: #0056ff;

        box-shadow: 0 0 8px rgba(0, 86, 255, 0.4);
      }

      /* =====================================================
   ATTENDANCE FORM LABELS
===================================================== */

      #attendanceView .form-label {
        color: #e2e8f0;
      }

      /* =====================================================
   SHIFT SELECTION
===================================================== */

      .shift-option {
        display: flex;

        align-items: center;

        margin-top: 10px;

        font-size: 15px;

        padding: 9px;

        border-radius: 8px;

        color: #e2e8f0;

        transition: background 0.2s ease;
      }

      .shift-option input {
        margin: 0;

        margin-right: 12px;

        width: auto;
      }

      .shift-option.auto-selected {
        background: rgba(0, 86, 255, 0.12);

        border: 1px solid rgba(0, 86, 255, 0.3);
      }

      .shift-hint {
        font-size: 12px;

        color: #a0aec0;

        margin-top: 7px;
      }

      /* =====================================================
   CAMERA
===================================================== */

      #camera,
      #selfieCanvas {
        width: 100%;

        border-radius: 12px;

        margin-top: 10px;

        background: #000000;

        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* =====================================================
   SELFIE BUTTON
===================================================== */

      .capture-btn {
        width: 100%;

        padding: 14px;

        margin-top: 10px;

        border: none;

        border-radius: 9px;

        color: #ffffff;

        font-size: 16px;

        font-weight: bold;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);

        transition: all 0.2s ease;
      }

      .selfie-start {
        background: #0056ff;
      }

      .selfie-start:hover {
        background: #0047d6;
      }

      .selfie-capture {
        background: #2ecc71;
      }

      .selfie-retake {
        background: #f39c12;
      }

      /* =====================================================
   ATTENDANCE ACTIONS
===================================================== */

      .attendance-actions {
        margin-top: 20px;
      }

      .attendance-actions button {
        width: 100%;

        padding: 16px;

        font-size: 17px;

        margin-top: 12px;

        border: none;

        border-radius: 9px;

        font-weight: bold;

        transition: all 0.2s ease;
      }

      /* Clock In */

      .clockin {
        background: #2ecc71;

        color: #ffffff;

        box-shadow: 0 5px 15px rgba(46, 204, 113, 0.2);
      }

      .clockin:hover {
        background: #27ae60;
      }

      /* Clock Out */

      .clockout {
        background: #d6001c;

        color: #ffffff;

        box-shadow: 0 5px 15px rgba(214, 0, 28, 0.25);
      }

      .clockout:hover {
        background: #b50017;
      }

      /* =====================================================
   RESPONSIVE
===================================================== */

      @media (max-width: 420px) {
        .container {
          padding: 12px;
        }

        .dashboard-actions {
          grid-template-columns: 1fr;
        }

        .dashboard-top {
          padding: 18px;
        }

        .table-card {
          padding: 8px;
        }

        .attendance-table {
          font-size: 11px;
        }

        .attendance-table th {
          padding: 7px 5px;
        }

        .attendance-table td {
          padding: 6px 4px;
        }
      }

      /* =====================================================
   SWEETALERT2 - K5TECH DARK GLASS THEME
===================================================== */

      .swal2-popup {
        background: rgba(18, 22, 33, 0.92) !important;

        backdrop-filter: blur(18px);

        -webkit-backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 16px !important;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6) !important;

        color: #ffffff !important;
      }

      /* =====================================================
   SWEETALERT TITLE
===================================================== */

      .swal2-title {
        color: #ffffff !important;

        font-size: 21px !important;

        font-weight: 700 !important;
      }

      /* =====================================================
   SWEETALERT CONTENT
===================================================== */

      .swal2-html-container,
      .swal2-content {
        color: #a0aec0 !important;

        font-size: 14px !important;
      }

      /* =====================================================
   CONFIRM BUTTON
===================================================== */

      .swal2-confirm {
        background: #d6001c !important;

        color: #ffffff !important;

        border: none !important;

        border-radius: 9px !important;

        padding: 11px 22px !important;

        font-size: 14px !important;

        font-weight: bold !important;

        box-shadow: 0 5px 15px rgba(214, 0, 28, 0.25) !important;
      }

      .swal2-confirm:hover {
        background: #b50017 !important;
      }

      /* =====================================================
   CANCEL BUTTON
===================================================== */

      .swal2-cancel {
        background: rgba(255, 255, 255, 0.08) !important;

        color: #e2e8f0 !important;

        border: 1px solid rgba(255, 255, 255, 0.12) !important;

        border-radius: 9px !important;

        padding: 11px 22px !important;

        font-size: 14px !important;

        font-weight: bold !important;
      }

      .swal2-cancel:hover {
        background: rgba(255, 255, 255, 0.13) !important;
      }

      /* =====================================================
   SWEETALERT DENY BUTTON
===================================================== */

      .swal2-deny {
        background: #0056ff !important;

        color: #ffffff !important;

        border-radius: 9px !important;

        font-weight: bold !important;
      }

      /* =====================================================
   SWEETALERT INPUT
===================================================== */

      .swal2-input,
      .swal2-textarea,
      .swal2-select {
        background: rgba(0, 0, 0, 0.3) !important;

        color: #ffffff !important;

        border: 1px solid rgba(255, 255, 255, 0.15) !important;

        border-radius: 8px !important;
      }

      .swal2-input:focus,
      .swal2-textarea:focus,
      .swal2-select:focus {
        border-color: #0056ff !important;

        box-shadow: 0 0 8px rgba(0, 86, 255, 0.4) !important;
      }

      /* =====================================================
   SWEETALERT VALIDATION MESSAGE
===================================================== */

      .swal2-validation-message {
        background: rgba(214, 0, 28, 0.12) !important;

        color: #ff7180 !important;
      }

      /* =====================================================
   SWEETALERT LOADING SPINNER
===================================================== */

      .swal2-loader {
        border-color: #d6001c transparent #d6001c transparent !important;
      }

      /* =====================================================
   SWEETALERT CLOSE BUTTON
===================================================== */

      .swal2-close {
        color: #a0aec0 !important;
      }

      .swal2-close:hover {
        color: #ffffff !important;
      }

      /* =====================================================
   SWEETALERT ICONS
===================================================== */

      .swal2-icon.swal2-success {
        border-color: #2ecc71 !important;

        color: #2ecc71 !important;
      }

      .swal2-icon.swal2-error {
        border-color: #d6001c !important;

        color: #d6001c !important;
      }

      .swal2-icon.swal2-warning {
        border-color: #f39c12 !important;

        color: #f39c12 !important;
      }

      .swal2-icon.swal2-info {
        border-color: #0056ff !important;

        color: #0056ff !important;
      }

      /* =====================================================
   SWEETALERT BACKDROP
===================================================== */

      .swal2-container {
        background: rgba(0, 0, 0, 0.6) !important;
      }

      /* =====================================================
   TOC KIOSK — SELECT USER SCREEN
===================================================== */

      .kiosk-card {
        width: 100%;
        max-width: 480px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 2rem 1.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        box-sizing: border-box;
      }

      .kiosk-roster-status {
        text-align: center;
        font-size: 13px;
        color: #a0aec0;
        margin: 4px 0 16px;

      .user-grid {

        padding: 4px 2px;

      .user-btn {
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;

      .user-btn .user-btn-pin {

      .kiosk-bottom-link {

        margin-top: 22px;
        padding: 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.06);

        color: #e2e8f0;
        text-decoration: none;

        font-weight: bold;
        transition: all 0.2s ease;
      }

      .kiosk-bottom-link:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* =====================================================
   TOC KIOSK — PIN OVERLAY
===================================================== */

      .pin-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(5, 6, 10, 0.75);

      .pin-title {
        text-align: center;

      .pin-subtitle {

      .pin-dots {
        display: flex;
        justify-content: center;

      .pin-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: transparent;
      }

      .pin-dot.filled {
        background: #d6001c;
        border-color: #d6001c;
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .keypad-btn {
        padding: 18px 0;
        font-size: 20px;
        font-weight: bold;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.3);
        color: #ffffff;
      }

      .keypad-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .keypad-btn.keypad-clear {
        font-size: 15px;
      }

      .pin-cancel-btn {
        width: 100%;
        margin-top: 16px;
        padding: 13px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 9px;
        background: transparent;
        color: #e2e8f0;
        font-size: 14px;
        font-weight: bold;
      }

      .pin-cancel-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* =====================================================
   TOC KIOSK — ATTENDANCE VIEW TWEAKS
===================================================== */

      .last-state-banner {
        margin: 10px 0 4px;
        padding: 10px 12px;
        border-radius: 9px;
        background: rgba(0, 86, 255, 0.12);
        border: 1px solid rgba(0, 86, 255, 0.35);
        color: #cfe0ff;
        font-size: 13px;
      }

      .switch-user-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #e2e8f0;
        font-size: 13px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
       TOC KIOSK — SELECT USER VIEW
  ===================================================== -->

    <section id="selectUserView">
      <div class="kiosk-card">
        <div class="login-logo-container">
          <img
            class="login-logo-img"
            src="K5Tech_Icon_512.png"
            alt="K5Tech" />
        </div>

        <h1 class="login-title">TOC Attendance</h1>

        <p id="operatorLine" class="login-subtitle"></p>

        <p class="login-subtitle">
          Tap your name below, then take a selfie and clock in or out.
        </p>

        <input
          id="userSearch"
          placeholder="Search your name..."
          oninput="renderUserGrid()" />

        <div id="rosterStatus" class="kiosk-roster-status">
          Loading roster...
        </div>

        <div id="userGrid" class="user-grid"></div>

        <div id="tocSyncStatus" style="font-size: 13px; color: #666; text-align: center; margin-top: 14px;">
          Checking sync status...
        </div>

        <a href="index.html" class="kiosk-bottom-link">
          ← Back to Employee Dashboard
        </a>
      </div>
    </section>

    <!-- =====================================================
       TOC KIOSK — PIN OVERLAY
  ===================================================== -->

    <div id="pinOverlay" class="pin-overlay hidden">
      <div class="kiosk-card">
        <h2 id="pinTitle" class="pin-title">Enter PIN</h2>

        <p id="pinSubtitle" class="pin-subtitle">for</p>

        <div id="pinDots" class="pin-dots"></div>

        <div class="keypad">
          <button type="button" class="keypad-btn" onclick="pressPinKey('1')">1</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('2')">2</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('3')">3</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('4')">4</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('5')">5</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('6')">6</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('7')">7</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('8')">8</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('9')">9</button>
          <button type="button" class="keypad-btn keypad-clear" onclick="pressPinKey('clear')">Clear</button>
          <button type="button" class="keypad-btn" onclick="pressPinKey('0')">0</button>
          <button type="button" class="keypad-btn keypad-clear" onclick="pressPinKey('back')">⌫</button>
        </div>

        <button type="button" class="primary-btn" style="margin-top: 16px;" onclick="confirmPin()">
          Confirm PIN
        </button>

        <button type="button" class="pin-cancel-btn" onclick="closePinOverlay()">
          Cancel
        </button>
      </div>
    </div>

    <!-- =====================================================
       ATTENDANCE VIEW
  ===================================================== -->

    <section id="attendanceView" class="hidden">
      <div class="container">
        <div class="card">
          <div class="attendance-header">
            <button
              type="button"
              class="back-btn switch-user-btn"
              onclick="returnToSelectUser()">
              ← Switch User
            </button>

            <div class="attendance-employee">
              <div id="attendanceEmployeeName" class="attendance-employee-name">
                Employee
              </div>

              <div class="attendance-employee-id">TOC Employee</div>
            </div>
          </div>

          <div id="lastStateBanner" class="last-state-banner hidden"></div>

          <div id="gps">📍 Detecting GPS...</div>

          <div class="location-note">Location required for attendance</div>

          <div id="syncStatus" style="font-size: 13px; color: #666">
            Checking sync status...
          </div>

          <label class="form-label"> Site Name </label>

          <input id="site" placeholder="Site Name" />

          <label class="form-label"> Notes </label>

          <textarea id="notes" placeholder="Notes"></textarea>

          <h3>Selfie Verification</h3>

          <div class="camera-box">
            <video id="camera" autoplay playsinline></video>

            <canvas id="selfieCanvas"></canvas>

            <div class="camera-controls">
              <button
                type="button"
                id="selfieBtn"
                class="capture-btn selfie-start">
                📷 Take Selfie
              </button>

          </div>

          <h3>Select Shift</h3>

          <div class="shift-group">
            <label class="shift-option" id="dayShiftOption">
              <input type="radio" name="shift" value="Day" />

              <span> Day Shift </span>
            </label>

            <label class="shift-option" id="nightShiftOption">
              <input type="radio" name="shift" value="Night" />

              <span> Night Shift </span>
            </label>

            <div id="shiftHint" class="shift-hint"></div>
          </div>

          <div class="attendance-actions">
            <button
              type="button"
              class="clockin"
              id="clockInBtn"
              onclick="submitAttendance('Clock-In')">
              Clock In
            </button>

            <button
              type="button"
              class="clockout"
              id="clockOutBtn"
              onclick="submitAttendance('Clock-Out')">
              Clock Out
            </button>
          </div>
        </div>
      </div>
    </section>

    <script>
      /**********************************************************
       * CONFIGURATION
       *
       * Same Apps Script Web App as the employee attendance app —
       * this page just uses different actions (getTocUsers,
       * toclogin, tocattendance).
       **********************************************************/

      const API_URL =
        "https://script.google.com/macros/s/AKfycbwWOmMc56V4dLS1DQPPQTHtc-2jXDvybxtuwyJ1yg8-xCfrMypfwtgWrHacqSpIy4KJ/exec";

      const ROSTER_CACHE_KEY = "k5techTocRosterCache";

      const LAST_SITE_KEY = "k5techTocLastSite";

      const IDLE_TIMEOUT_MS = 90000; // 90s of no interaction on the attendance screen returns to Select User

      /**********************************************************
       * OPERATOR / ACCESS CONTROL
       *
       * TOC kiosk mode may only be opened by a regular
       * employee who is (a) logged into the employee app in
       * this same browser tab, and (b) flagged TRUE in
       * Column E of the users sheet. SESSION_KEY matches
       * index.html's session key exactly, since sessionStorage
       * carries over when navigating same-origin in the same
       * tab (e.g. tapping the dashboard's kiosk link).
       *
       * The employee-app login already told the server whether
       * this account has TOC access, but we deliberately don't
       * trust that cached flag alone here — checkTocAccess asks
       * the server fresh, and every TOC POST action re-verifies
       * it again server-side too.
       **********************************************************/

      const SESSION_KEY = "k5techAttendanceUser";

      let operator = null; // { employeeId, name }

      function goToEmployeeLogin(message) {
        if (message) {
          sessionStorage.setItem("k5techTocAccessMessage", message);
        }

        window.location.href = "index.html";
      }

      async function requireTocOperator() {
        let session = null;

        try {
          const saved = sessionStorage.getItem(SESSION_KEY);

          session = saved ? JSON.parse(saved) : null;
        } catch (err) {
          session = null;
        }

        if (!session || !session.employeeId) {
          goToEmployeeLogin(
            "Please log in first, then use Switch to TOC Attendance.",
          );

          return false;
        }

        try {
          const res = await fetch(
            API_URL +
              "?action=checkTocAccess&employeeId=" +
              encodeURIComponent(session.employeeId),
          );

          const data = await res.json();

          if (data.status !== "success" || !data.authorized) {
            goToEmployeeLogin(
              "Your account is not authorized for TOC Attendance.",
            );

            return false;
          }

          operator = {
            employeeId: session.employeeId,

            name: data.name || session.name || session.employeeId,
          };

          document.getElementById("operatorLine").innerText =
            "Operated by " + operator.name;

          return true;
        } catch (err) {
          console.error("TOC access check failed:", err);

          Swal.fire(
            "Could not verify TOC access. Check your connection and try again.",
          );

          return false;
        }
      }

      /**********************************************************
       * KIOSK STATE
       **********************************************************/

      let tocUsers = []; // [{ username, hasPin }]

      let selectedUser = null; // { username }

      let lastState = null; // { clockType, shift } or null

      let pinUser = null; // { username, hasPin }

      let pinBuffer = "";

      let idleTimer = null;

      /**********************************************************
       * ROSTER (SELECT USER SCREEN)
       **********************************************************/

      const rosterStatusEl = document.getElementById("rosterStatus");

      const userGridEl = document.getElementById("userGrid");

      async function loadTocUsers() {
        try {
          const res = await fetch(API_URL + "?action=getTocUsers");

          const data = await res.json();

          if (data.status !== "success") {
            throw new Error(data.message || "Failed to load roster");
          }

          tocUsers = data.users || [];

          localStorage.setItem(ROSTER_CACHE_KEY, JSON.stringify(tocUsers));

          rosterStatusEl.innerText = tocUsers.length
            ? ""
            : "No TOC users found. Add usernames to the TOC_Users sheet.";

          renderUserGrid();
        } catch (err) {
          console.error("Roster load error:", err);

          const cached = localStorage.getItem(ROSTER_CACHE_KEY);

          if (cached) {
            tocUsers = JSON.parse(cached);

            rosterStatusEl.innerText =
              "🟠 Offline — showing last saved roster.";

            renderUserGrid();
          } else {
            tocUsers = [];

            rosterStatusEl.innerHTML =
              'Unable to load roster. <a href="#" onclick="loadTocUsers();return false;" style="color:#5b9dff;">Retry</a>';

            userGridEl.innerHTML = "";
          }
        }
      }

      function renderUserGrid() {
        const filter = document
          .getElementById("userSearch")
          .value.trim()
          .toLowerCase();

        const filtered = filter
          ? tocUsers.filter((u) => u.username.toLowerCase().includes(filter))
          : tocUsers;

        if (!filtered.length) {
          userGridEl.innerHTML = tocUsers.length
            ? '<div class="user-empty-note">No matching names.</div>'
            : "";

          return;
        }

        userGridEl.innerHTML = filtered
          .map(
            (u) => `
              <button type="button" class="user-btn" onclick="selectUser('${u.username.replace(/'/g, "\\'")}')">
                ${u.username}
                ${u.hasPin ? '<span class="user-btn-pin">🔒 PIN required</span>' : ""}
              </button>
            `,
          )
          .join("");
      }

      /**********************************************************
       * PIN ENTRY
       **********************************************************/

      const pinOverlayEl = document.getElementById("pinOverlay");

      function selectUser(username) {
        const user = tocUsers.find((u) => u.username === username);

        if (!user) {
          Swal.fire("That user is no longer on the roster. Refreshing...");

          loadTocUsers();

          return;
        }

        if (!user.hasPin) {
          performTocLogin(username, "");

          return;
        }

        pinUser = user;

        pinBuffer = "";

        document.getElementById("pinTitle").innerText = "Enter PIN";

        document.getElementById("pinSubtitle").innerText = "for " + username;

        renderPinDots();

        pinOverlayEl.classList.remove("hidden");
      }

      function renderPinDots() {
        const dotsEl = document.getElementById("pinDots");

        if (!pinBuffer.length) {
          dotsEl.innerHTML =
            '<span style="font-size:13px;color:#a0aec0;">Enter your PIN</span>';

          return;
        }

        dotsEl.innerHTML = pinBuffer
          .split("")
          .map(() => '<span class="pin-dot filled"></span>')
          .join("");
      }

      function pressPinKey(key) {
        if (key === "clear") {
          pinBuffer = "";
        } else if (key === "back") {
          pinBuffer = pinBuffer.slice(0, -1);
        } else if (pinBuffer.length < 8) {
          pinBuffer += key;
        }

        renderPinDots();
      }

      function closePinOverlay() {
        pinOverlayEl.classList.add("hidden");

        pinUser = null;

        pinBuffer = "";
      }

      async function confirmPin() {
        if (!pinUser) {
          return;
        }

        if (!pinBuffer) {
          Swal.fire("Please enter your PIN.");

          return;
        }

        await performTocLogin(pinUser.username, pinBuffer);
      }

      async function performTocLogin(username, pin) {
        Swal.fire({
          title: "Checking...",

          allowOutsideClick: false,

          didOpen: () => {
            Swal.showLoading();
          },
        });

        try {
          const res = await fetch(API_URL, {
            method: "POST",

            body: JSON.stringify({
              action: "toclogin",

              operatorEmployeeId: operator ? operator.employeeId : "",

              username: username,

              pin: pin,
            }),
          });

          const data = await res.json();

          Swal.close();

          if (data.status !== "success") {
            Swal.fire(data.message || "Unable to verify user.");

            return;
          }

          closePinOverlay();

          selectedUser = { username: data.user.username, pin: pin };

          lastState = data.lastState || null;

          showAttendanceView();
        } catch (err) {
          Swal.close();

          console.error("TOC login error:", err);

          Swal.fire(
            "Could not reach the server. Check your connection and try again.",
          );
        }
      }

      /**********************************************************
       * VIEW SWITCHING
       **********************************************************/

      function showSelectUserView() {
        clearIdleTimer();

        stopCamera();

        document.getElementById("attendanceView").classList.add("hidden");

        document.getElementById("selectUserView").classList.remove("hidden");

        selectedUser = null;

        lastState = null;

        document.getElementById("userSearch").value = "";

        loadTocUsers();

        refreshPendingStatus();
      }

      function returnToSelectUser() {
        showSelectUserView();
      }

      function showAttendanceView() {
        document.getElementById("selectUserView").classList.add("hidden");

        document.getElementById("attendanceView").classList.remove("hidden");

        document.getElementById("attendanceEmployeeName").innerText =
          selectedUser.username;

        const lastSite = localStorage.getItem(LAST_SITE_KEY) || "";

        document.getElementById("site").value = lastSite;

        clearAttendanceForm(false);

        applyLastStateHint();

        initializeGPS();

        refreshPendingStatus();

        resetIdleTimer();
      }

      function applyLastStateHint() {
        const banner = document.getElementById("lastStateBanner");

        if (lastState && lastState.clockType === "Clock-In" && lastState.shift) {
          selectShift(lastState.shift);

          banner.innerText =
            "Already clocked in (" +
            lastState.shift +
            " Shift). Tap Clock Out below when done, using the same shift.";

          banner.classList.remove("hidden");
        } else {
          banner.classList.add("hidden");

          setShiftHint("Select the shift you are attending.");
        }
      }

      /**********************************************************
       * IDLE TIMEOUT
       *
       * If the attendance screen sits untouched, return to
       * Select User so the next TOC employee never accidentally
       * submits under someone else's name.
       **********************************************************/

      function resetIdleTimer() {
        clearIdleTimer();

        idleTimer = setTimeout(() => {
          if (!document.getElementById("attendanceView").classList.contains("hidden")) {
            Swal.close();

            showSelectUserView();
          }
        }, IDLE_TIMEOUT_MS);
      }

      function clearIdleTimer() {
        if (idleTimer) {
          clearTimeout(idleTimer);

          idleTimer = null;
        }
      }

      ["click", "touchstart", "keydown", "input"].forEach((evt) => {
        document.getElementById("attendanceView").addEventListener(evt, () => {
          if (!document.getElementById("attendanceView").classList.contains("hidden")) {
            resetIdleTimer();
          }
        });
      });

      /**********************************************************
       * SHIFT HELPERS
       **********************************************************/

      function selectShift(shift) {
        const radio = document.querySelector(
          `input[name="shift"][value="${shift}"]`,
        );

        if (!radio) {
          return;
        }

        radio.checked = true;

        document
          .getElementById(
            shift === "Day" ? "dayShiftOption" : "nightShiftOption",
          )
          .classList.add("auto-selected");
      }

      function clearShiftSelection() {
        document.querySelectorAll('input[name="shift"]').forEach((radio) => {
          radio.checked = false;
        });

        document
          .getElementById("dayShiftOption")
          .classList.remove("auto-selected");

        document
          .getElementById("nightShiftOption")
          .classList.remove("auto-selected");

        setShiftHint("");
      }

      function setShiftHint(text) {
        document.getElementById("shiftHint").innerText = text || "";
      }

      /**********************************************************
       * ATTENDANCE SYSTEM
       **********************************************************/

      let lat = "";

      let lng = "";

      let resolvedAddress = "";

      let stream = null;

      let capturedImage = "";

      let cameraActive = false;

      let isSubmitting = false;

      const DB_NAME = "k5tech-toc-attendance-db";

      const DB_VERSION = 1;

      const STORE_NAME = "pendingTocAttendance";

      const gpsEl = document.getElementById("gps");

      const video = document.getElementById("camera");

      const canvas = document.getElementById("selfieCanvas");

      const selfieBtn = document.getElementById("selfieBtn");

      const clockInBtn = document.getElementById("clockInBtn");

      const clockOutBtn = document.getElementById("clockOutBtn");

      const syncEl = document.getElementById("syncStatus");

      const tocSyncEl = document.getElementById("tocSyncStatus");

      function setSyncStatus(text, color) {
        syncEl.innerText = text;

        syncEl.style.color = color || "#666";

        tocSyncEl.innerText = text;

        tocSyncEl.style.color = color || "#666";
      }

      /**********************************************************
       * INDEXED DB
       **********************************************************/

      function openDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);

          request.onupgradeneeded = function (event) {
            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, {
                keyPath: "recordId",
              });
            }
          };

          request.onsuccess = function () {
            resolve(request.result);
          };

          request.onerror = function () {
            reject(request.error);
          };
        });
      }

      async function savePendingSubmission(payload) {
        const db = await openDb();

        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");

          const store = tx.objectStore(STORE_NAME);

          store.put(payload);

          tx.oncomplete = () => resolve();

          tx.onerror = () => reject(tx.error);
        });
      }

      async function getPendingSubmissions() {
        const db = await openDb();

        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");

          const store = tx.objectStore(STORE_NAME);

          const request = store.getAll();

          request.onsuccess = () => {
            const items = request.result || [];

            items.sort((a, b) =>
              (a.clientTimestampFile || "").localeCompare(
                b.clientTimestampFile || "",
              ),
            );

            resolve(items);
          };

          request.onerror = () => reject(request.error);
        });
      }

      async function deletePendingSubmission(recordId) {
        const db = await openDb();

        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");

          const store = tx.objectStore(STORE_NAME);

          store.delete(recordId);

          tx.oncomplete = () => resolve();

          tx.onerror = () => reject(tx.error);
        });
      }

      async function getPendingCount() {
        const items = await getPendingSubmissions();

        return items.length;
      }

      async function refreshPendingStatus() {
        const count = await getPendingCount();

        if (!navigator.onLine) {
          setSyncStatus(
            `🟠 Offline${count ? " • Pending sync: " + count : ""}`,

            "#b26a00",
          );

          return;
        }

        if (count > 0) {
          setSyncStatus(
            `🟡 Online • Pending sync: ${count}`,

            "#9a7b00",
          );
        } else {
          setSyncStatus(
            "🟢 Online • All synced",

            "#2e7d32",
          );
        }
      }

      function createRecordId() {
        return (
          "toc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8)
        );
      }

      function formatCoord(value) {
        return value === "" || value === null || value === undefined
          ? ""
          : Number(value).toFixed(6);
      }

      function getLocationText() {
        if (resolvedAddress) {
          return resolvedAddress.length > 60
            ? resolvedAddress.slice(0, 60) + "..."
            : resolvedAddress;
        }

        if (lat !== "" && lng !== "") {
          return `GPS: ${formatCoord(lat)}, ${formatCoord(lng)}`;
        }

        return "GPS unavailable";
      }

      function pad2(num) {
        return String(num).padStart(2, "0");
      }

      function getClientTimestampText() {
        const now = new Date();

        const yyyy = now.getFullYear();

        const mm = pad2(now.getMonth() + 1);

        const dd = pad2(now.getDate());

        const hh = pad2(now.getHours());

        const mi = pad2(now.getMinutes());

        const ss = pad2(now.getSeconds());

        return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
      }

      function getClientTimestampFile() {
        const now = new Date();

        const yyyy = now.getFullYear();

        const mm = pad2(now.getMonth() + 1);

        const dd = pad2(now.getDate());

        const hh = pad2(now.getHours());

        const mi = pad2(now.getMinutes());

        return `${yyyy}-${mm}-${dd}_${hh}-${mi}`;
      }

      function buildWatermarkLines(name, site, timestampText) {
        const line1 = `${name} | ${timestampText} | ${site || "-"}`;

        const line2 = getLocationText();

        return [line1, line2];
      }

      async function fetchAddressFromCoords(lat, lng) {
        try {
          const url = `${API_URL}?action=reverseGeocode&lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}`;

          const res = await fetch(url);

          const data = await res.json();

          if (data.status === "success" && data.address) {
            return data.address;
          }

          return "";
        } catch (err) {
          console.error("Address fetch error:", err);

          return "";
        }
      }

      /**********************************************************
       * GPS
       **********************************************************/

      function initializeGPS() {
        if (!navigator.geolocation) {
          gpsEl.innerHTML = "❌ GPS not supported";

          return;
        }

        navigator.geolocation.getCurrentPosition(
          async function (pos) {
            lat = pos.coords.latitude;

            lng = pos.coords.longitude;

            gpsEl.innerHTML =
              "📍 GPS: " + lat.toFixed(6) + ", " + lng.toFixed(6);

            resolvedAddress = await fetchAddressFromCoords(lat, lng);

            refreshPendingStatus();
          },

          function (err) {
            console.error("GPS error:", err);

            if (err.code === 1) {
              gpsEl.innerHTML =
                "❌ Location access denied. Please enable it in your browser/system settings.";
            } else {
              gpsEl.innerHTML = "❌ GPS unavailable";
            }

            refreshPendingStatus();
          },

          {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 60000,
          },
        );
      }

      /**********************************************************
       * CAMERA
       **********************************************************/

      async function startCamera() {
        if (cameraActive) {
          return true;
        }

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
            },

            audio: false,
          });

          video.srcObject = stream;

          video.style.display = "block";

          canvas.style.display = "none";

          await new Promise((resolve) => {
            video.onloadedmetadata = () => resolve();
          });

          await video.play();

          await new Promise((resolve) => setTimeout(resolve, 300));

          cameraActive = true;

          return true;
        } catch (err) {
          console.error("Camera error:", err);

          Swal.fire(
            "Unable to access camera. Please allow camera permission and try again.",
          );

          return false;
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());

          stream = null;
        }

        video.srcObject = null;

        cameraActive = false;
      }

      selfieBtn.onclick = async function () {
        const ctx = canvas.getContext("2d");

        if (!cameraActive) {
          const started = await startCamera();

          if (!started) {
            return;
          }

          selfieBtn.innerText = "📸 Capture";

          selfieBtn.classList.remove("selfie-start", "selfie-retake");

          selfieBtn.classList.add("selfie-capture");

          return;
        }

        if (cameraActive && !capturedImage) {
          if (
            !video.srcObject ||
            video.readyState < 2 ||
            !video.videoWidth ||
            !video.videoHeight
          ) {
            Swal.fire(
              "Camera is still loading. Please wait a moment and try again.",
            );

            return;
          }

          canvas.width = video.videoWidth;

          canvas.height = video.videoHeight;

          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          video.style.display = "none";

          canvas.style.display = "block";

          capturedImage = canvas.toDataURL("image/jpeg", 0.9);

          stopCamera();

          selfieBtn.innerText = "🔄 Retake Selfie";

          selfieBtn.classList.remove("selfie-capture");

          selfieBtn.classList.add("selfie-retake");

          return;
        }

        if (capturedImage) {
          capturedImage = "";

          canvas.style.display = "none";

          const started = await startCamera();

          if (!started) {
            return;
          }

          selfieBtn.innerText = "📸 Capture";

          selfieBtn.classList.remove("selfie-retake");

          selfieBtn.classList.add("selfie-capture");
        }
      };

      /**********************************************************
       * CLEAR ATTENDANCE FORM
       *
       * keepSite: pass false the first time a user is shown the
       * attendance screen (so the last-used Site Name prefill
       * survives), true afterward (e.g. after a submission,
       * where we deliberately keep the site for the next TOC
       * employee at the same location).
       **********************************************************/

      function clearAttendanceForm(keepSite = true) {
        if (!keepSite) {
          document.getElementById("site").value = "";
        }

        document.getElementById("notes").value = "";

        capturedImage = "";

        clearShiftSelection();

        selfieBtn.innerText = "📷 Take Selfie";

        selfieBtn.classList.remove("selfie-capture", "selfie-retake");

        selfieBtn.classList.add("selfie-start");

        canvas.style.display = "none";

        video.style.display = "none";

        stopCamera();
      }

      function setSubmittingState(submitting) {
        isSubmitting = submitting;

        clockInBtn.disabled = submitting;

        clockOutBtn.disabled = submitting;

        selfieBtn.disabled = submitting;
      }

      function addWatermark(canvas, lines) {
        const ctx = canvas.getContext("2d");

        const boxHeight = 80;

        const boxY = canvas.height - boxHeight - 10;

        ctx.fillStyle = "rgba(0,0,0,0.65)";

        ctx.fillRect(10, boxY, canvas.width - 20, boxHeight);

        ctx.fillStyle = "white";

        ctx.font = "22px Arial";

        ctx.fillText(lines[0], 20, boxY + 28);

        ctx.font = "18px Arial";

        ctx.fillText(lines[1], 20, boxY + 58);

        return canvas.toDataURL("image/jpeg", 0.9);
      }

      /**********************************************************
       * BUILD PAYLOAD
       **********************************************************/

      function buildPayload(clockType) {
        if (!selectedUser) {
          throw new Error("No selected TOC user.");
        }

        const username = selectedUser.username;

        const site = document.getElementById("site").value.trim();

        const notes = document.getElementById("notes").value.trim();

        const shift = document.querySelector(
          'input[name="shift"]:checked',
        )?.value;

        const clientTimestampText = getClientTimestampText();

        const clientTimestampFile = getClientTimestampFile();

        return {
          action: "tocattendance",

          operatorEmployeeId: operator ? operator.employeeId : "",

          recordId: createRecordId(),

          clientTimestampText: clientTimestampText,

          clientTimestampFile: clientTimestampFile,

          username: username,

          pin: selectedUser.pin || "",

          shift: shift,

          clockType: clockType,

          site: site,

          notes: notes,

          lat: lat,

          lng: lng,

          address: resolvedAddress || "",

          image: addWatermark(
            canvas,

            buildWatermarkLines(username, site, clientTimestampText),
          ),
        };
      }

      async function sendPayload(payload) {
        const response = await fetch(API_URL, {
          method: "POST",

          body: JSON.stringify(payload),
        });

        return response.json();
      }

      /**********************************************************
       * SYNC PENDING ATTENDANCE
       **********************************************************/

      async function syncPendingAttendance(showSuccessToast = false) {
        if (!navigator.onLine) {
          await refreshPendingStatus();

          return;
        }

        const pending = await getPendingSubmissions();

        if (!pending.length) {
          await refreshPendingStatus();

          return;
        }

        setSyncStatus(
          `🔄 Syncing ${pending.length} pending entr${
            pending.length === 1 ? "y" : "ies"
          }...`,

          "#1565c0",
        );

        for (const item of pending) {
          try {
            const res = await sendPayload(item);

            if (res.status === "success") {
              await deletePendingSubmission(item.recordId);

              continue;
            }

            console.error("Pending sync blocked:", res.message);

            break;
          } catch (err) {
            console.error("Pending sync failed:", err);

            break;
          }
        }

        await refreshPendingStatus();

        if (showSuccessToast) {
          const count = await getPendingCount();

          if (count === 0) {
            Swal.fire({
              icon: "success",

              title: "Pending attendance synced",

              timer: 1200,

              showConfirmButton: false,
            });
          }
        }
      }

      /**********************************************************
       * SUBMIT ATTENDANCE
       **********************************************************/

      async function submitAttendance(clockType) {
        if (isSubmitting) {
          return;
        }

        setSubmittingState(true);

        if (!selectedUser) {
          setSubmittingState(false);

          showSelectUserView();

          return;
        }

        const shift = document.querySelector(
          'input[name="shift"]:checked',
        )?.value;

        if (!shift) {
          setSubmittingState(false);

          Swal.fire("Please select a shift");

          return;
        }

        if (!capturedImage) {
          setSubmittingState(false);

          Swal.fire("Please capture selfie");

          return;
        }

        const payload = buildPayload(clockType);

        const siteToRemember = document.getElementById("site").value.trim();

        const actionLabel =
          clockType === "Clock-In" ? "Clocking In" : "Clocking Out";

        Swal.fire({
          title: selectedUser.username + " " + actionLabel + "...",

          text: "Please wait",

          allowOutsideClick: false,

          didOpen: () => {
            Swal.showLoading();
          },
        });

        try {
          if (!navigator.onLine) {
            await savePendingSubmission(payload);

            if (siteToRemember) {
              localStorage.setItem(LAST_SITE_KEY, siteToRemember);
            }

            setSubmittingState(false);

            await refreshPendingStatus();

            await Swal.fire({
              icon: "info",

              title: "Saved offline",

              text: selectedUser.username + "'s attendance was saved on this device and will sync automatically when internet returns.",

              timer: 2200,

              showConfirmButton: false,
            });

            showSelectUserView();

            return;
          }

          const res = await sendPayload(payload);

          setSubmittingState(false);

          if (res.status === "error") {
            Swal.fire(res.message);

            return;
          }

          if (siteToRemember) {
            localStorage.setItem(LAST_SITE_KEY, siteToRemember);
          }

          await Swal.fire({
            icon: "success",

            title: selectedUser.username + " — " + clockType + " Saved",

            timer: 1500,

            showConfirmButton: false,
          });

          await refreshPendingStatus();

          showSelectUserView();
        } catch (err) {
          console.error("Submit error:", err);

          try {
            await savePendingSubmission(payload);

            if (siteToRemember) {
              localStorage.setItem(LAST_SITE_KEY, siteToRemember);
            }

            setSubmittingState(false);

            await refreshPendingStatus();

            await Swal.fire({
              icon: "warning",

              title: "Saved offline",

              text: "Upload failed, but attendance was saved on this device and will sync automatically later.",

              timer: 2200,

              showConfirmButton: false,
            });

            showSelectUserView();
          } catch (dbErr) {
            setSubmittingState(false);

            console.error("Offline save error:", dbErr);

            Swal.fire("Failed to save attendance. Please try again.");
          }
        }
      }

      /**********************************************************
       * ONLINE / OFFLINE EVENTS
       **********************************************************/

      window.addEventListener("online", () => {
        refreshPendingStatus();

        syncPendingAttendance(true);
      });

      window.addEventListener("offline", () => {
        refreshPendingStatus();
      });

      /**********************************************************
       * SERVICE WORKER
       **********************************************************/

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./service-worker.js")

          .then((registration) => {
            console.log("[Service Worker] Registered successfully.");

            registration.addEventListener("updatefound", () => {
              const newWorker = registration.installing;

              if (!newWorker) {
                return;
              }

              newWorker.addEventListener("statechange", () => {
                if (
                  newWorker.state === "installed" &&
                  navigator.serviceWorker.controller
                ) {
                  Swal.fire({
                    icon: "info",

                    title: "Update Available",

                    text: "A new version of TOC Attendance is available.",

                    confirmButtonText: "Update Now",

                    allowOutsideClick: false,
                  }).then((result) => {
                    if (result.isConfirmed) {
                      newWorker.postMessage({
                        action: "skipWaiting",
                      });
                    }
                  });
                }
              });
            });
          })

          .catch((error) => {
            console.error("[Service Worker] Registration failed:", error);
          });

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          window.location.reload();
        });
      }

      /**********************************************************
       * APPLICATION INITIALIZATION
       *
       * The kiosk always starts at Select User — no session is
       * ever restored, so a phone that gets closed/reopened (or
       * left idle past the timeout) can never resume mid-flow
       * under the wrong name.
       **********************************************************/

      async function initializeApp() {
        const authorized = await requireTocOperator();

        if (!authorized) {
          return;
        }

        showSelectUserView();

        syncPendingAttendance(false);
      }

      initializeApp();
    </script>
  </body>
</html>
